# Siteyi oluşturup GitHub Pages'e yayınlar.
# Tetikleyiciler:
#  - main dalına kod gönderildiğinde
#  - Yönetim panelinden yazı yayınlandığında (Supabase → repository_dispatch "yayin")
#  - Saatte bir: ileri tarihli yazılar vaktinde yayına girsin ve Supabase uykuya geçmesin
#  - Elle: Actions sekmesinden "Run workflow"
name: Yayın

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [yayin]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
