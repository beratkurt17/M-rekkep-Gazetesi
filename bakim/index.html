<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mürekkep — Yenileniyoruz</title>
  <meta name="description" content="Mürekkep Gazetesi yeni yüzüyle çok yakında yayında.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e8e0d0">
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <!-- Bakım sayfası: yalnızca depoda bakim/AKTIF dosyası varken yayınlanır (.github/workflows/yayin.yml) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      background: #e8e0d0;
      color: #25221f;
      font-family: Georgia, 'Times New Roman', serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 40px 0 36px;
      border-top: 3px solid #25221f;
      border-bottom: 1px solid #25221f;
    }
    img { display: block; width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 50%; mix-blend-mode: multiply; }
    h1 { margin: 0; font-size: clamp(44px, 13vw, 68px); line-height: 1; font-weight: 700; letter-spacing: -0.01em; }
    .etiket {
      margin: 22px 0 12px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #742f38;
    }
    p { margin: 0; font-size: 19px; line-height: 1.6; color: #47423c; }
    em { color: #25221f; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.jpg" alt="">
    <h1>Mürekkep</h1>
    <p class="etiket">Bakımdayız</p>
    <p>Gazetemiz yeni yüzüyle hazırlanıyor.<br><em>Çok yakında yeniden yayındayız.</em></p>
  </main>
</body>
</html>
