<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mürekkep Gazetesi — Yenileniyoruz</title>
  <meta name="description" content="Mürekkep Gazetesi yeni yüzüyle çok yakında yayında.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Lora:ital@0;1&family=Playfair+Display:wght@800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #faf8f4;
      color: #141414;
      font-family: 'Lora', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main {
      max-width: 560px;
      width: 100%;
      text-align: center;
      border-top: 3px double #1a1a1a;
      border-bottom: 3px double #1a1a1a;
      padding: 40px 0;
    }
    img { width: 96px; height: 96px; border-radius: 50%; display: block; margin: 0 auto 20px; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(44px, 12vw, 72px);
      line-height: 1;
      margin: 0;
    }
    .label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6b1d1d;
      margin: 24px 0 12px;
    }
    p.lead { font-size: 19px; line-height: 1.6; color: #4a4744; margin: 0; }
    p.lead em { color: #141414; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.jpg" alt="">
    <h1>Mürekkep</h1>
    <p class="label">Yenileniyoruz</p>
    <p class="lead">Gazetemiz yeni yüzüyle hazırlanıyor.<br><em>Çok yakında yeniden yayındayız.</em></p>
  </main>
</body>
</html>
